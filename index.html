<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espacio Zubex</title>
<style>
  :root{
    --zx-blue-dark:#0D18A8;
    --zx-blue:#227EF6;
    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#1c2233;
    --muted:#6b7385;
    --border:#e3e7f1;
  }
  [data-theme="dark"]{
    --bg:#0b0e17;
    --panel:#141a2b;
    --text:#eef1fa;
    --muted:#9aa3ba;
    --border:#232b42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins','Segoe UI', -apple-system, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:290px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }

  /* ---------- HEADER: liquid glass ---------- */
  #sidebar-header{
    position:relative;
    padding:22px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.15);
    background:linear-gradient(135deg,var(--zx-blue-dark) 0%, var(--zx-blue) 100%);
    overflow:hidden;
    isolation:isolate;
  }
  #sidebar-header::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(120px 120px at 15% 20%, rgba(255,255,255,.35), transparent 70%),
      radial-gradient(140px 140px at 85% 80%, rgba(34,126,246,.55), transparent 70%),
      radial-gradient(100px 100px at 70% 10%, rgba(255,255,255,.18), transparent 70%);
    filter:blur(18px);
    animation:blob-float 12s ease-in-out infinite alternate;
  }
  @keyframes blob-float{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(-8px,6px) scale(1.08); }
  }
  #logo-chip{
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(6px);
    border-radius:14px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
  }
  #logo-chip img{
    height:56px;
    width:auto;
    display:block;
  }
  #theme-toggle{
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(6px);
    color:#fff;
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  #theme-toggle:hover{ background:rgba(255,255,255,.3); }

  /* ---------- AREAS / APP ITEMS ---------- */
  .area-block{border-bottom:1px solid var(--border); padding:8px 10px;}
  .area-title{
    padding:10px 8px 6px 8px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.7px;
  }

  .app-item{
    --mx:50%;
    --my:50%;
    position:relative;
    margin:6px 2px;
    padding:1px;
    border-radius:12px;
    background:
      linear-gradient(var(--panel),var(--panel)) padding-box,
      radial-gradient(160px circle at var(--mx) var(--my), var(--zx-blue) 0%, rgba(34,126,246,.15) 45%, transparent 70%) border-box;
    border:1px solid var(--border);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .app-item:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(13,24,168,.10);
  }
  .app-item.active{
    background:
      linear-gradient(var(--panel),var(--panel)) padding-box,
      linear-gradient(120deg, var(--zx-blue-dark), var(--zx-blue)) border-box;
    border:1px solid transparent;
  }
  .app-item-inner{
    padding:10px 14px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border-radius:11px;
  }
  .app-item .app-desc{font-size:11px;color:var(--muted);}
  .app-item strong{font-size:14px;}

  /* ---------- MAIN AREA ---------- */
  #main{flex:1;display:flex;flex-direction:column;}
  #topbar{
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #reload-btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-size:12px;
  }
  iframe{flex:1;border:none;width:100%;background:#fff;}
  #placeholder{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;text-align:center;padding:20px;
  }
</style>
</head>

      </div>
      <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
    <div id="areas-container">Cargando apps.json…</div>
  </div>

  <div id="main">
    <div id="topbar">
      <span id="current-app-label">Selecciona una herramienta del menú</span>
      <button id="reload-btn" onclick="reloadFrame()">⟳ Recargar</button>
    </div>
    <div id="placeholder">
      👈 El contenido de cada app se carga aquí sin salir del portal
    </div>
    <iframe id="app-frame" style="display:none"></iframe>
  </div>

<script>
// ---------------------------------------------------------------
// PATRÓN CLAVE: el sidebar NO tiene las apps hardcodeadas.
// Lee apps.json en cada carga. Cada área agrega/edita SU bloque
// dentro de ese archivo -> conflictos de merge mínimos y aislados.
// ---------------------------------------------------------------

let currentUserRole = "*"; // placeholder: aquí luego se conecta el login real

async function cargarApps() {
  const contenedor = document.getElementById("areas-container");
  try {
    const res = await fetch("apps.json?_=" + Date.now()); // cache-busting simple
    const data = await res.json();

    contenedor.innerHTML = "";
    data.areas.forEach(area => {
      if (!area.apps || area.apps.length === 0) return; // oculta áreas aún sin apps
      const bloque = document.createElement("div");
      bloque.className = "area-block";

      const titulo = document.createElement("div");
      titulo.className = "area-title";
      titulo.textContent = (area.icono || "") + " " + area.nombre;
      bloque.appendChild(titulo);

      area.apps
        .filter(app => appVisibleParaUsuario(app))
        .forEach(app => {
          const item = document.createElement("div");
          item.className = "app-item";
          item.innerHTML = "<div class=\"app-item-inner\"><strong>" + app.nombre + "</strong><span class=\"app-desc\">" + (app.descripcion || "") + "</span></div>";
          item.addEventListener("mousemove", (e) => {
            const rect = item.getBoundingClientRect();
            item.style.setProperty("--mx", (e.clientX - rect.left) + "px");
            item.style.setProperty("--my", (e.clientY - rect.top) + "px");
          });
          item.onclick = () => abrirApp(app, item);
          bloque.appendChild(item);
        });

      contenedor.appendChild(bloque);
    });
  } catch (err) {
    contenedor.innerHTML = "<div style=\"padding:16px;color:#c0392b;font-size:13px\">No se pudo cargar apps.json (" + err.message + ")</div>";
  }
}

// Filtro de acceso: hoy todo pasa con "*". El día que activen
// usuarios, solo se cambia esta función — nada más en el sistema.
function appVisibleParaUsuario(app) {
  if (!app.rolesPermitidos || app.rolesPermitidos.includes("*")) return true;
  return app.rolesPermitidos.includes(currentUserRole);
}

function abrirApp(app, itemEl) {
  document.querySelectorAll(".app-item").forEach(el => el.classList.remove("active"));
  itemEl.classList.add("active");
  document.getElementById("current-app-label").textContent = app.nombre;

  const frame = document.getElementById("app-frame");
  frame.src = app.url;
  frame.style.display = "block";
  document.getElementById("placeholder").style.display = "none";
}

function reloadFrame() {
  const frame = document.getElementById("app-frame");
  if (frame.src) frame.src = frame.src.split("?")[0] + "?_=" + Date.now();
}

function toggleTheme() {
  const body = document.body;
  const isDark = body.getAttribute("data-theme") === "dark";
  body.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-toggle").textContent = isDark ? "🌙" : "☀️";
}

cargarApps();
</script>
