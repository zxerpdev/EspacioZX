<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espacio Zubex</title>
<style>
  :root{
    --zx-blue-dark:#0D18A8;
    --zx-blue:#227EF6;
    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#1c2233;
    --muted:#6b7385;
    --border:#e3e7f1;
  }
  [data-theme="dark"]{
    --bg:#0b0e17;
    --panel:#141a2b;
    --text:#eef1fa;
    --muted:#9aa3ba;
    --border:#232b42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins','Segoe UI', -apple-system, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:290px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }

  #sidebar-header{
    position:relative;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  #logo-wordmark{
    font-size:26px;
    font-weight:700;
    color:var(--zx-blue-dark);
    letter-spacing:-.5px;
    line-height:1;
    display:flex;
    align-items:flex-start;
    gap:2px;
  }
  #logo-wordmark sup{
    font-size:11px;
    font-weight:600;
    margin-top:2px;
  }
  #logo-tagline{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:1.6px;
    color:var(--muted);
    text-transform:uppercase;
  }
  #theme-toggle{
    position:absolute;
    top:20px;
    right:18px;
    background:rgba(13,24,168,.08);
    border:1px solid rgba(13,24,168,.15);
    color:var(--zx-blue-dark);
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  #theme-toggle:hover{ background:rgba(13,24,168,.15); }

  /* ---------- AREAS / APP ITEMS ---------- */
  .area-block{border-bottom:1px solid var(--border);}
  .area-header{
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .area-header:hover{ background:rgba(34,126,246,.06); }
  .area-header-left{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .area-icon{ font-size:15px; }
  .area-title{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.7px;
  }
  .area-chevron{
    font-size:10px;
    color:var(--muted);
    transition:transform .18s ease;
  }
  .area-block.expanded .area-chevron{ transform:rotate(90deg); }
  .area-apps{
    max-height:0;
    overflow:hidden;
    padding:0 10px;
    transition:max-height .22s ease, padding .22s ease;
  }
  .area-block.expanded .area-apps{
    max-height:900px;
    padding:2px 10px 10px;
  }

  .app-item{
    --mx:50%;
    --my:50%;
    position:relative;
    margin:6px 2px;
    padding:2px;
    border-radius:12px;
    background:
      linear-gradient(var(--panel),var(--panel)) padding-box,
      radial-gradient(circle 170px at var(--mx) var(--my), var(--zx-blue) 0%, rgba(34,126,246,.35) 40%, transparent 72%) border-box;
    border:2px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .app-item:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(13,24,168,.10);
  }
  .app-item.active{
    background:
      linear-gradient(135deg, rgba(34,126,246,.14), rgba(13,24,168,.10)) padding-box,
      linear-gradient(120deg, var(--zx-blue-dark), var(--zx-blue)) border-box;
    border:2px solid transparent;
  }
  .app-item.active strong{ color:var(--zx-blue-dark); font-weight:700; }
  .app-item-inner{
    padding:9px 13px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border-radius:10px;
    pointer-events:none;
  }
  .app-item .app-desc{font-size:11px;color:var(--muted); font-weight:400;}
  .app-item strong{
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    letter-spacing:.1px;
  }
  .app-item.disabled{ cursor:default; opacity:.55; }
  .badge-proximamente{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--zx-blue-dark);
    background:rgba(13,24,168,.10);
    border-radius:6px;
    padding:2px 6px;
    margin-left:6px;
  }

  /* ---------- MAIN AREA ---------- */
  #main{flex:1;display:flex;flex-direction:column;}
  #topbar{
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #reload-btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-size:12px;
  }
  iframe{flex:1;border:none;width:100%;background:#fff;}
  #placeholder{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;text-align:center;padding:20px;
  }
  #loading-overlay{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--bg);
    color:var(--muted);
    font-size:13px;
  }
  .spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid var(--border);
    border-top-color:var(--zx-blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body data-theme="light">

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="logo-chip">
        <div id="logo-wordmark">zubex<sup>&reg;</sup></div>
        <div id="logo-tagline">Portal interno</div>
      </div>
      <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
    <div id="areas-container">Cargando apps.json…</div>
  </div>

  <div id="main">
    <div id="topbar">
      <span id="current-app-label">Selecciona una herramienta del menú</span>
      <button id="reload-btn" onclick="reloadFrame()">⟳ Recargar</button>
    </div>
    <div id="placeholder">
      👈 El contenido de cada app se carga aquí sin salir del portal
    </div>
    <div id="loading-overlay" style="display:none">
      <div class="spinner"></div>
      <span id="loading-label">Cargando…</span>
    </div>
    <iframe id="app-frame" style="display:none"></iframe>
  </div>

<script>
let currentUserRole = "*"; // placeholder: aquí luego se conecta el login real

async function cargarApps() {
  const contenedor = document.getElementById("areas-container");
  try {
    const res = await fetch("apps.json?_=" + Date.now());
    const data = await res.json();

    contenedor.innerHTML = "";
    data.areas.forEach(area => {
      if (!area.apps || area.apps.length === 0) return;
      const bloque = document.createElement("div");
      bloque.className = "area-block";

      const header = document.createElement("div");
      header.className = "area-header";
      header.innerHTML =
        "<div class=\"area-header-left\">" +
          "<span class=\"area-icon\">" + (area.icono || "") + "</span>" +
          "<span class=\"area-title\">" + area.nombre + "</span>" +
        "</div>" +
        "<span class=\"area-chevron\">▶</span>";
      header.onclick = () => bloque.classList.toggle("expanded");
      bloque.appendChild(header);

      const appsWrap = document.createElement("div");
      appsWrap.className = "area-apps";

      area.apps
        .filter(app => appVisibleParaUsuario(app))
        .forEach(app => {
          const disponible = app.estado !== "en_desarrollo" && !!app.url;
          const item = document.createElement("div");
          item.className = "app-item" + (disponible ? "" : " disabled");
          const badge = disponible ? "" : "<span class=\"badge-proximamente\">Próximamente</span>";
          item.innerHTML = "<div class=\"app-item-inner\"><strong>" + app.nombre + badge + "</strong><span class=\"app-desc\">" + (app.descripcion || "") + "</span></div>";
          item.addEventListener("mousemove", (e) => {
            const rect = item.getBoundingClientRect();
            item.style.setProperty("--mx", (e.clientX - rect.left) + "px");
            item.style.setProperty("--my", (e.clientY - rect.top) + "px");
          });
          if (disponible) {
            item.onclick = (e) => { e.stopPropagation(); abrirApp(app, item); };
          }
          appsWrap.appendChild(item);
        });

      bloque.appendChild(appsWrap);
      contenedor.appendChild(bloque);
    });
  } catch (err) {
    contenedor.innerHTML = "<div style=\"padding:16px;color:#c0392b;font-size:13px\">No se pudo cargar apps.json (" + err.message + ")</div>";
  }
}

function appVisibleParaUsuario(app) {
  if (!app.rolesPermitidos || app.rolesPermitidos.includes("*")) return true;
  return app.rolesPermitidos.includes(currentUserRole);
}

function abrirApp(app, itemEl) {
  document.querySelectorAll(".app-item").forEach(el => el.classList.remove("active"));
  itemEl.classList.add("active");
  document.getElementById("current-app-label").textContent = app.nombre;

  const frame = document.getElementById("app-frame");
  const overlay = document.getElementById("loading-overlay");
  const label = document.getElementById("loading-label");

  document.getElementById("placeholder").style.display = "none";
  frame.style.display = "none";
  label.textContent = "Cargando " + app.nombre + "…";
  overlay.style.display = "flex";

  frame.onload = () => {
    overlay.style.display = "none";
    frame.style.display = "block";
  };
  frame.src = app.url;
}

function reloadFrame() {
  const frame = document.getElementById("app-frame");
  const overlay = document.getElementById("loading-overlay");
  const label = document.getElementById("loading-label");
  if (!frame.src) return;
  label.textContent = "Recargando…";
  frame.style.display = "none";
  overlay.style.display = "flex";
  frame.onload = () => {
    overlay.style.display = "none";
    frame.style.display = "block";
  };
  frame.src = frame.src.split("?")[0] + "?_=" + Date.now();
}

function toggleTheme() {
  const body = document.body;
  const isDark = body.getAttribute("data-theme") === "dark";
  body.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-toggle").textContent = isDark ? "🌙" : "☀️";
}

cargarApps();
</script>
</body>
</html>
