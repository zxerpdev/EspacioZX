<script>
// ================================================================
// AVISOS RH — lectura de cumpleaños, aniversarios y eventos
// Usa el MISMO proyecto de Firebase que la app "Avisos RH" (donde
// RH captura los datos). Reemplaza estas credenciales con las reales.
// ================================================================
const avisosFirebaseConfig = {
  apiKey: "AIzaSyALMsnRFm7lugu49BExOL9Jq2X95CJutQ4",
  authDomain: "zxavisosrh.firebaseapp.com",
  databaseURL: "https://zxavisosrh-default-rtdb.firebaseio.com/",
  projectId: "zxavisosrh",
  storageBucket: "zxavisosrh.firebasestorage.app",
  messagingSenderId: "543585258090",
  appId: "1:543585258090:web:12a8ca26c147901357d813"
};

let avisosDb = null;
try {
  const avisosApp = firebase.initializeApp(avisosFirebaseConfig, "avisos");
  avisosDb = avisosApp.database();
} catch (e) {
  console.warn("Avisos RH: Firebase no configurado todavía.", e);
}

// --- utilidades de fecha ---
function soloFecha(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function sumarDias(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function mismoDia(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

// Dada una fecha "mes/día" (repetida cada año) devuelve, comparado con hoy,
// si corresponde mostrar el aviso hoy y con qué estado:
//  - 'hoy'       -> el día real cae entre semana (o es hoy exactamente)
//  - 'porCumplir'-> el día real cae en fin de semana y hoy es el viernes anterior
//  - 'cumplido'  -> el día real cayó en fin de semana y hoy es el lunes siguiente
//  - null        -> no corresponde mostrar nada hoy
function estadoDeFecha(mesDiaISO, hoy) {
  if (!mesDiaISO) return null;
  const [, mesStr, diaStr] = mesDiaISO.split('-');
  const mes = parseInt(mesStr, 10) - 1;
  const dia = parseInt(diaStr, 10);
  const fechaEsteAno = soloFecha(new Date(hoy.getFullYear(), mes, dia));
  const diaSemana = fechaEsteAno.getDay(); // 0=domingo, 6=sábado

  // El día real SIEMPRE se muestra (para operadores, que trabajan también sáb/dom).
  if (mismoDia(hoy, fechaEsteAno)) return 'hoy';

  // Si además cae en fin de semana, se avisa también el viernes antes
  // ("por cumplir") y el lunes después ("cumplido"), para administrativos
  // que no laboran sábado/domingo.
  if (diaSemana === 6) { // sábado
    const viernes = sumarDias(fechaEsteAno, -1);
    const lunes = sumarDias(fechaEsteAno, 2);
    if (mismoDia(hoy, viernes)) return 'porCumplir';
    if (mismoDia(hoy, lunes)) return 'cumplido';
  }
  if (diaSemana === 0) { // domingo
    const viernes = sumarDias(fechaEsteAno, -2);
    const lunes = sumarDias(fechaEsteAno, 1);
    if (mismoDia(hoy, viernes)) return 'porCumplir';
    if (mismoDia(hoy, lunes)) return 'cumplido';
  }
  return null;
}

function renderAvisoLista(contenedorId, items, mensajeVacio) {
  const el = document.getElementById(contenedorId);
  if (!el) return;
  if (!items.length) {
    el.innerHTML = `<div class="avisos-empty">${mensajeVacio}</div>`;
    return;
  }
  el.innerHTML = items.map(it => `
    <div class="aviso-card ${it.pendiente ? 'pendiente' : ''}">
      ${it.foto ? `<img class="aviso-foto${it.fotoRect ? ' rect' : ''}" src="${it.foto}">` : `<div class="aviso-icon">${it.icono}</div>`}
      <div>
        <div class="aviso-titulo">${it.titulo}</div>
        <div class="aviso-texto">${it.texto}</div>
      </div>
    </div>`).join('');
}

// Convierte enlaces comunes (YouTube, Drive) a su versión embebible.
// Si no reconoce el formato, deja un enlace simple para abrir en pestaña nueva.
function embedVideoUrl(url) {
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([\w-]{6,})/);
  if (yt) return { tipo: 'iframe', src: `https://www.youtube.com/embed/${yt[1]}` };
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return { tipo: 'iframe', src: `https://drive.google.com/file/d/${drive[1]}/preview` };
  return { tipo: 'enlace', src: url };
}

function renderVideosLista(items, mensajeVacio) {
  const el = document.getElementById('avisos-videos');
  if (!el) return;
  if (!items.length) {
    el.innerHTML = `<div class="avisos-empty">${mensajeVacio}</div>`;
    return;
  }
  el.innerHTML = items.map(v => {
    let cuerpo;
    if (v.tipo === 'archivo') {
      cuerpo = `<video controls src="${v.url}"></video>`;
    } else {
      const emb = embedVideoUrl(v.url || '');
      cuerpo = emb.tipo === 'iframe'
        ? `<iframe src="${emb.src}" allowfullscreen></iframe>`
        : `<a class="video-link" href="${emb.src}" target="_blank" rel="noopener">Ver video ↗</a>`;
    }
    return `<div class="video-card">
      <div class="video-card-titulo">${v.titulo}</div>
      ${v.descripcion ? `<div class="video-card-texto">${v.descripcion}</div>` : ''}
      ${cuerpo}
    </div>`;
  }).join('');
}

function cargarAvisos() {
  if (!avisosDb) {
    renderAvisoLista('avisos-cumple', [], 'Sin conectar (falta configurar Firebase).');
    renderAvisoLista('avisos-aniversario', [], 'Sin conectar (falta configurar Firebase).');
    renderAvisoLista('avisos-eventos', [], 'Sin conectar (falta configurar Firebase).');
    renderVideosLista([], 'Sin conectar (falta configurar Firebase).');
    return;
  }
  const hoy = soloFecha(new Date());

  avisosDb.ref('personal').on('value', snap => {
    const personal = snap.val() || {};
    const cumples = [];
    const aniversarios = [];

    Object.values(personal).forEach(p => {
      if (p.fechaNacimiento) {
        const estado = estadoDeFecha(p.fechaNacimiento, hoy);
        if (estado === 'hoy') {
          cumples.push({ icono: '🎂', foto: p.foto, titulo: p.nombre, texto: '¡Hoy cumple años!', pendiente: false });
        } else if (estado === 'porCumplir') {
          cumples.push({ icono: '🎂', foto: p.foto, titulo: p.nombre, texto: 'Por cumplir años este fin de semana', pendiente: true });
        } else if (estado === 'cumplido') {
          cumples.push({ icono: '🎂', foto: p.foto, titulo: p.nombre, texto: 'Cumplió años el fin de semana', pendiente: false });
        }
      }
      if (p.fechaIngreso) {
        const estado = estadoDeFecha(p.fechaIngreso, hoy);
        if (estado) {
          const anos = hoy.getFullYear() - parseInt(p.fechaIngreso.split('-')[0], 10);
          if (anos > 0) {
            if (estado === 'hoy') {
              aniversarios.push({ icono: '🎉', foto: p.foto, titulo: p.nombre, texto: `¡Hoy cumple ${anos} ${anos===1?'año':'años'} en Zubex!`, pendiente: false });
            } else if (estado === 'porCumplir') {
              aniversarios.push({ icono: '🎉', foto: p.foto, titulo: p.nombre, texto: `Por cumplir ${anos} ${anos===1?'año':'años'} este fin de semana`, pendiente: true });
            } else if (estado === 'cumplido') {
              aniversarios.push({ icono: '🎉', foto: p.foto, titulo: p.nombre, texto: `Cumplió ${anos} ${anos===1?'año':'años'} el fin de semana`, pendiente: false });
            }
          }
        }
      }
    });

    renderAvisoLista('avisos-cumple', cumples, 'No hay cumpleaños hoy.');
    renderAvisoLista('avisos-aniversario', aniversarios, 'No hay aniversarios hoy.');
  });

  avisosDb.ref('eventos').on('value', snap => {
    const eventos = snap.val() || {};
    const proximos = Object.values(eventos)
      .filter(e => e.fecha && e.fecha >= hoy.toISOString().slice(0, 10))
      .sort((a, b) => a.fecha.localeCompare(b.fecha))
      .slice(0, 6)
      .map(e => {
        const [y, m, d] = e.fecha.split('-');
        return { icono: '📅', foto: e.foto, fotoRect: true, titulo: e.titulo, texto: `${d}/${m}/${y}${e.descripcion ? ' — ' + e.descripcion : ''}`, pendiente: false };
      });
    renderAvisoLista('avisos-eventos', proximos, 'No hay eventos próximos.');
  });

  avisosDb.ref('videos').on('value', snap => {
    const videos = snap.val() || {};
    const lista = Object.values(videos);
    renderVideosLista(lista, 'No hay videos por ahora.');
  });
}

cargarAvisos();
</script>

<script type="module">
// ---------------------------------------------------------------
// Threads (adaptado de react-bits, sin React) — fondo de hebras
// onduladas en WebGL (vía la librería 'ogl', cargada como módulo
// ES desde esm.sh, sin necesidad de Node/bundler).
// Se ejecuta detrás de todo (#threads-bg, z-index:0) y sigue el
// mouse a nivel de toda la ventana (igual que el Splash Cursor),
// ya que el contenedor tiene pointer-events:none para no bloquear
// clics en el sidebar/apps.
// ---------------------------------------------------------------
import { Renderer, Program, Mesh, Triangle, Color } from 'https://esm.sh/ogl@1.0.11';

function initThreadsBackground(container, {
  color = [0.133, 0.494, 0.965], // azul de marca #227EF6 normalizado
  amplitude = 1.4,
  distance = 0.15,
  enableMouseInteraction = true
} = {}) {
  if (!container) return null;

  const vertexShader = `
attribute vec2 position;
attribute vec2 uv;
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

  const fragmentShader = `
precision highp float;

uniform float iTime;
uniform vec3 iResolution;
uniform vec3 uColor;
uniform float uAmplitude;
uniform float uDistance;
uniform vec2 uMouse;

#define PI 3.1415926538

const int u_line_count = 40;
const float u_line_width = 7.0;
const float u_line_blur = 10.0;

float Perlin2D(vec2 P) {
    vec2 Pi = floor(P);
    vec4 Pf_Pfmin1 = P.xyxy - vec4(Pi, Pi + 1.0);
    vec4 Pt = vec4(Pi.xy, Pi.xy + 1.0);
    Pt = Pt - floor(Pt * (1.0 / 71.0)) * 71.0;
    Pt += vec2(26.0, 161.0).xyxy;
    Pt *= Pt;
    Pt = Pt.xzxz * Pt.yyww;
    vec4 hash_x = fract(Pt * (1.0 / 951.135664));
    vec4 hash_y = fract(Pt * (1.0 / 642.949883));
    vec4 grad_x = hash_x - 0.49999;
    vec4 grad_y = hash_y - 0.49999;
    vec4 grad_results = inversesqrt(grad_x * grad_x + grad_y * grad_y)
        * (grad_x * Pf_Pfmin1.xzxz + grad_y * Pf_Pfmin1.yyww);
    grad_results *= 1.4142135623730950;
    vec2 blend = Pf_Pfmin1.xy * Pf_Pfmin1.xy * Pf_Pfmin1.xy
               * (Pf_Pfmin1.xy * (Pf_Pfmin1.xy * 6.0 - 15.0) + 10.0);
    vec4 blend2 = vec4(blend, vec2(1.0 - blend));
    return dot(grad_results, blend2.zxzx * blend2.wwyy);
}

float pixel(float count, vec2 resolution) {
    return (1.0 / max(resolution.x, resolution.y)) * count;
}

float lineFn(vec2 st, float width, float perc, float offset, vec2 mouse, float time, float amplitude, float distance) {
    float split_offset = (perc * 0.4);
    float split_point = 0.1 + split_offset;

    float amplitude_normal = smoothstep(split_point, 0.7, st.x);
    float amplitude_strength = 0.5;
    float finalAmplitude = amplitude_normal * amplitude_strength
                           * amplitude * (1.0 + (mouse.y - 0.5) * 0.2);

    float time_scaled = time / 10.0 + (mouse.x - 0.5) * 1.0;
    float blur = smoothstep(split_point, split_point + 0.05, st.x) * perc;

    float xnoise = mix(
        Perlin2D(vec2(time_scaled, st.x + perc) * 2.5),
        Perlin2D(vec2(time_scaled, st.x + time_scaled) * 3.5) / 1.5,
        st.x * 0.3
    );

    float y = 0.5 + (perc - 0.5) * distance + xnoise / 2.0 * finalAmplitude;

    float line_start = smoothstep(
        y + (width / 2.0) + (u_line_blur * pixel(1.0, iResolution.xy) * blur),
        y,
        st.y
    );

    float line_end = smoothstep(
        y,
        y - (width / 2.0) - (u_line_blur * pixel(1.0, iResolution.xy) * blur),
        st.y
    );

    return clamp(
        (line_start - line_end) * (1.0 - smoothstep(0.0, 1.0, pow(perc, 0.3))),
        0.0,
        1.0
    );
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord / iResolution.xy;

    float line_strength = 1.0;
    for (int i = 0; i < u_line_count; i++) {
        float p = float(i) / float(u_line_count);
        line_strength *= (1.0 - lineFn(
            uv,
            u_line_width * pixel(1.0, iResolution.xy) * (1.0 - p),
            p,
            (PI * 1.0) * p,
            uMouse,
            iTime,
            uAmplitude,
            uDistance
        ));
    }

    float colorVal = 1.0 - line_strength;
    fragColor = vec4(uColor * colorVal, colorVal);
}

void main() {
    mainImage(gl_FragColor, gl_FragCoord.xy);
}
`;

  const renderer = new Renderer({ alpha: true });
  const gl = renderer.gl;
  gl.clearColor(0, 0, 0, 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  container.appendChild(gl.canvas);

  const geometry = new Triangle(gl);
  const program = new Program(gl, {
    vertex: vertexShader,
    fragment: fragmentShader,
    uniforms: {
      iTime: { value: 0 },
      iResolution: {
        value: new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height)
      },
      uColor: { value: new Color(...color) },
      uAmplitude: { value: amplitude },
      uDistance: { value: distance },
      uMouse: { value: new Float32Array([0.5, 0.5]) }
    }
  });

  const mesh = new Mesh(gl, { geometry, program });

  // El shader es pesado (ruido Perlin por pixel x 40 líneas), así que se
  // limita la resolución interna de render para que no sufra en pantallas
  // grandes/alto DPI — el efecto es lo bastante suave que no se nota.
  const MAX_RENDER_DIM = 1920;
  function resize() {
    const clientWidth = container.clientWidth || window.innerWidth;
    const clientHeight = container.clientHeight || window.innerHeight;
    const baseDpr = Math.min(window.devicePixelRatio || 1, 2);
    const longestSide = Math.max(clientWidth, clientHeight) * baseDpr;
    const dpr = longestSide > MAX_RENDER_DIM ? (baseDpr * MAX_RENDER_DIM) / longestSide : baseDpr;
    renderer.dpr = dpr;
    renderer.setSize(clientWidth, clientHeight);
    program.uniforms.iResolution.value.r = gl.canvas.width;
    program.uniforms.iResolution.value.g = gl.canvas.height;
    program.uniforms.iResolution.value.b = gl.canvas.width / gl.canvas.height;
  }

  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(container);
  window.addEventListener('resize', resize);
  resize();

  const currentMouse = [0.5, 0.5];
  let targetMouse = [0.5, 0.5];

  // A diferencia del componente original (que escucha mousemove solo
  // dentro de su propio contenedor), aquí el contenedor tiene
  // pointer-events:none para no bloquear clics del portal — así que
  // escuchamos el mouse a nivel de toda la ventana, igual que el
  // Splash Cursor.
  function handleMouseMove(e) {
    targetMouse = [e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight];
  }
  if (enableMouseInteraction) {
    window.addEventListener('mousemove', handleMouseMove);
  }

  let isVisible = true;
  const intersectionObserver = new IntersectionObserver(
    entries => { isVisible = entries[0].isIntersecting; },
    { threshold: 0 }
  );
  intersectionObserver.observe(container);

  let rafId = null;
  let active = true;

  function update(t) {
    rafId = requestAnimationFrame(update);
    if (!isVisible || document.hidden) return;

    if (enableMouseInteraction) {
      const smoothing = 0.05;
      currentMouse[0] += smoothing * (targetMouse[0] - currentMouse[0]);
      currentMouse[1] += smoothing * (targetMouse[1] - currentMouse[1]);
      program.uniforms.uMouse.value[0] = currentMouse[0];
      program.uniforms.uMouse.value[1] = currentMouse[1];
    } else {
      program.uniforms.uMouse.value[0] = 0.5;
      program.uniforms.uMouse.value[1] = 0.5;
    }
    program.uniforms.iTime.value = t * 0.001;

    renderer.render({ scene: mesh });
  }
  rafId = requestAnimationFrame(update);

  return function disable() {
    active = false;
    if (rafId) cancelAnimationFrame(rafId);
    resizeObserver.disconnect();
    intersectionObserver.disconnect();
    window.removeEventListener('resize', resize);
    if (enableMouseInteraction) window.removeEventListener('mousemove', handleMouseMove);
    if (container.contains(gl.canvas)) container.removeChild(gl.canvas);
    gl.getExtension('WEBGL_lose_context')?.loseContext();
  };
}

window.disableThreadsBackground = initThreadsBackground(document.getElementById('threads-bg'), {
  color: [0.133, 0.494, 0.965],
  amplitude: 1.4,
  distance: 0.15,
  enableMouseInteraction: true
});
</script>
</body>
</html>
