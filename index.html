<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espacio Zubex</title>
<style>
  :root{
    --zx-blue-dark:#0D18A8;
    --zx-blue:#227EF6;
    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#1c2233;
    --muted:#6b7385;
    --border:#e3e7f1;
  }
  [data-theme="dark"]{
    --bg:#0b0e17;
    --panel:#141a2b;
    --text:#eef1fa;
    --muted:#9aa3ba;
    --border:#232b42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins','Segoe UI', -apple-system, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:290px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }

  #sidebar-header{
    position:relative;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  #logo-wordmark{
    font-size:26px;
    font-weight:700;
    color:var(--zx-blue-dark);
    letter-spacing:-.5px;
    line-height:1;
    display:flex;
    align-items:flex-start;
    gap:2px;
  }
  #logo-wordmark sup{
    font-size:11px;
    font-weight:600;
    margin-top:2px;
  }
  #logo-tagline{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:1.6px;
    color:var(--muted);
    text-transform:uppercase;
  }
  #theme-toggle{
    position:absolute;
    top:20px;
    right:18px;
    background:rgba(13,24,168,.08);
    border:1px solid rgba(13,24,168,.15);
    color:var(--zx-blue-dark);
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  #theme-toggle:hover{ background:rgba(13,24,168,.15); }

  /* ---------- AREAS / SUBAREAS (acordeón) ---------- */
  .area-block{border-bottom:1px solid var(--border);}
  .area-header{
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .area-header:hover{ background:rgba(34,126,246,.06); }
  .area-header-left{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .area-icon{ font-size:15px; }
  .area-title{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.7px;
  }
  .area-chevron{
    font-size:10px;
    color:var(--muted);
    transition:transform .18s ease;
  }
  .area-block.expanded > .area-header .area-chevron{ transform:rotate(90deg); }
  .area-body{
    max-height:0;
    overflow:hidden;
    padding:0 10px;
    transition:max-height .22s ease, padding .22s ease;
  }
  .area-block.expanded > .area-body{
    max-height:2000px;
    padding:2px 10px 10px;
  }

  .subarea-block{ border-top:1px dashed var(--border); }
  .subarea-block:first-child{ border-top:none; }
  .subarea-header{
    padding:9px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .subarea-header:hover{ background:rgba(34,126,246,.05); }
  .subarea-header-left{ display:flex; align-items:center; gap:7px; }
  .subarea-icon{ font-size:13px; }
  .subarea-title{
    font-size:11.5px;
    font-weight:600;
    color:var(--text);
  }
  .subarea-chevron{
    font-size:9px;
    color:var(--muted);
    transition:transform .18s ease;
  }
  .subarea-block.expanded > .subarea-header .subarea-chevron{ transform:rotate(90deg); }
  .subarea-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .2s ease;
  }
  .subarea-block.expanded > .subarea-body{ max-height:1200px; }

  .app-item{
    --mx:50%;
    --my:50%;
    position:relative;
    margin:6px 2px;
    padding:2px;
    border-radius:12px;
    background:
      linear-gradient(var(--panel),var(--panel)) padding-box,
      radial-gradient(circle 170px at var(--mx) var(--my), var(--zx-blue) 0%, rgba(34,126,246,.35) 40%, transparent 72%) border-box;
    border:2px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .app-item:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(13,24,168,.10);
  }
  .app-item.active{
    background:
      linear-gradient(135deg, rgba(34,126,246,.14), rgba(13,24,168,.10)) padding-box,
      linear-gradient(120deg, var(--zx-blue-dark), var(--zx-blue)) border-box;
    border:2px solid transparent;
  }
  .app-item.active strong{ color:var(--zx-blue-dark); font-weight:700; }
  .app-item-inner{
    padding:9px 13px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border-radius:10px;
    pointer-events:none;
  }
  .app-item .app-desc{font-size:11px;color:var(--muted); font-weight:400;}
  .app-item strong{
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    letter-spacing:.1px;
  }
  .app-item.pendiente{ opacity:.75; }
  .badge-proximamente{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--zx-blue-dark);
    background:rgba(13,24,168,.10);
    border-radius:6px;
    padding:2px 6px;
    margin-left:6px;
  }
  .empty-note{
    font-size:11px;
    color:var(--muted);
    padding:6px 6px 10px;
    font-style:italic;
  }

  /* ---------- MAIN AREA ---------- */
  #main{flex:1;display:flex;flex-direction:column;}
  #topbar{
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #reload-btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-size:12px;
  }
  iframe{flex:1;border:none;width:100%;background:#fff;}

  /* ---------- HOME / DASHBOARD ---------- */
  #home{
    flex:1;
    overflow-y:auto;
    padding:40px 24px 30px;
    background:
      radial-gradient(500px 300px at 15% -10%, rgba(34,126,246,.08), transparent 60%),
      radial-gradient(500px 300px at 90% 0%, rgba(13,24,168,.06), transparent 60%),
      var(--bg);
  }
  #home-inner{ max-width:760px; margin:0 auto; text-align:center; }
  #home h1{
    font-size:24px;
    font-weight:700;
    color:var(--zx-blue-dark);
    margin:0 0 26px;
    letter-spacing:.2px;
  }
  #home-orb{
    width:110px;
    height:110px;
    margin:0 auto 30px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--zx-blue-dark), var(--zx-blue));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-size:26px;
    letter-spacing:1px;
    box-shadow:0 10px 34px rgba(13,24,168,.28), 0 0 0 8px rgba(34,126,246,.08);
  }
  #home-tagline{
    font-size:14px;
    color:var(--muted);
    margin-bottom:24px;
  }
  #home-continue{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(120deg, var(--zx-blue-dark), var(--zx-blue));
    color:#fff;
    border:none;
    padding:11px 26px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:36px;
  }
  .home-section-title{
    text-align:left;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:var(--muted);
    margin:0 0 12px;
  }
  #quick-access{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
    gap:12px;
    margin-bottom:30px;
  }
  .quick-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .quick-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(13,24,168,.10); }
  .quick-card-icon{ font-size:22px; margin-bottom:6px; }
  .quick-card-label{ font-size:12px; font-weight:600; color:var(--text); }

  #anuncios{ display:flex; flex-direction:column; gap:10px; text-align:left; }
  .anuncio-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
  }
  .anuncio-titulo{ font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:3px; }
  .anuncio-texto{ font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .anuncio-fecha{ font-size:11px; color:var(--muted); }

  /* ---------- LOADING / EN CONSTRUCCIÓN ---------- */
  #loading-overlay, #construccion-view{
    flex:1;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--bg);
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:20px;
  }
  .spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid var(--border);
    border-top-color:var(--zx-blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #construccion-view{ position:relative; overflow:hidden; }
  #construccion-view::before{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:640px; height:640px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(34,126,246,.10) 55%, transparent 75%);
    filter:blur(6px);
    z-index:0;
  }
  [data-theme="dark"] #construccion-view::before{
    background:radial-gradient(circle, rgba(238,241,250,.85) 0%, rgba(34,126,246,.14) 55%, transparent 75%);
  }
  #construccion-view img{
    position:relative;
    z-index:1;
    max-width:520px;
    width:88%;
    mix-blend-mode:multiply;
  }
  [data-theme="dark"] #construccion-view img{ mix-blend-mode:normal; }
  #construccion-view .c-title{ position:relative; z-index:1; font-size:15px; font-weight:700; color:var(--text); }
</style>
</head>

      <div class="c-title" id="construccion-app-name">Esta sección está en construcción</div>
      <div>Próximamente</div>
    </div>

    <iframe id="app-frame" style="display:none"></iframe>
  </div>

<script>
let currentUserRole = "*"; // placeholder: aquí luego se conecta el login real
let appsPlanas = []; // todas las apps activas, para accesos rápidos

async function cargarApps() {
  const contenedor = document.getElementById("areas-container");
  try {
    const res = await fetch("apps.json?_=" + Date.now());
    const data = await res.json();

    contenedor.innerHTML = "";
    appsPlanas = [];

    data.areas.forEach(area => {
      const tieneApps = area.apps && area.apps.length > 0;
      const tieneSubareas = area.subareas && area.subareas.length > 0;
      if (!tieneApps && !tieneSubareas) return;

      const bloque = document.createElement("div");
      bloque.className = "area-block";

      const header = document.createElement("div");
      header.className = "area-header";
      header.innerHTML =
        "<div class=\"area-header-left\">" +
          "<span class=\"area-icon\">" + (area.icono || "") + "</span>" +
          "<span class=\"area-title\">" + area.nombre + "</span>" +
        "</div>" +
        "<span class=\"area-chevron\">▶</span>";
      header.onclick = () => bloque.classList.toggle("expanded");
      bloque.appendChild(header);

      const body = document.createElement("div");
      body.className = "area-body";

      if (tieneSubareas) {
        area.subareas.forEach(sub => {
          const subBloque = document.createElement("div");
          subBloque.className = "subarea-block";

          const subHeader = document.createElement("div");
          subHeader.className = "subarea-header";
          subHeader.innerHTML =
            "<div class=\"subarea-header-left\">" +
              "<span class=\"subarea-icon\">" + (sub.icono || "") + "</span>" +
              "<span class=\"subarea-title\">" + sub.nombre + "</span>" +
            "</div>" +
            "<span class=\"subarea-chevron\">▶</span>";
          subHeader.onclick = (e) => { e.stopPropagation(); subBloque.classList.toggle("expanded"); };
          subBloque.appendChild(subHeader);

          const subBody = document.createElement("div");
          subBody.className = "subarea-body";
          if (sub.apps && sub.apps.length > 0) {
            sub.apps.filter(appVisibleParaUsuario).forEach(app => {
              subBody.appendChild(crearAppItem(app));
            });
          } else {
            subBody.innerHTML = "<div class=\"empty-note\">Sin herramientas aún</div>";
          }
          subBloque.appendChild(subBody);
          body.appendChild(subBloque);
        });
      } else {
        area.apps.filter(appVisibleParaUsuario).forEach(app => {
          body.appendChild(crearAppItem(app));
        });
      }

      bloque.appendChild(body);
      contenedor.appendChild(bloque);
    });

    renderQuickAccess();
    renderAnuncios(data.anuncios || []);
  } catch (err) {
    contenedor.innerHTML = "<div style=\"padding:16px;color:#c0392b;font-size:13px\">No se pudo cargar apps.json (" + err.message + ")</div>";
  }
}

function crearAppItem(app) {
  const disponible = app.estado !== "en_desarrollo" && !!app.url;
  if (disponible) appsPlanas.push(app);

  const item = document.createElement("div");
  item.className = "app-item" + (disponible ? "" : " pendiente");
  const badge = disponible ? "" : "<span class=\"badge-proximamente\">Próximamente</span>";
  item.innerHTML = "<div class=\"app-item-inner\"><strong>" + app.nombre + badge + "</strong><span class=\"app-desc\">" + (app.descripcion || "") + "</span></div>";
  item.addEventListener("mousemove", (e) => {
    const rect = item.getBoundingClientRect();
    item.style.setProperty("--mx", (e.clientX - rect.left) + "px");
    item.style.setProperty("--my", (e.clientY - rect.top) + "px");
  });
  item.onclick = (e) => {
    e.stopPropagation();
    if (disponible) {
      abrirApp(app, item);
    } else {
      mostrarConstruccion(app, item);
    }
  };
  return item;
}

function renderQuickAccess() {
  const cont = document.getElementById("quick-access");
  cont.innerHTML = "";
  appsPlanas.slice(0, 6).forEach(app => {
    const card = document.createElement("div");
    card.className = "quick-card";
    card.innerHTML = "<div class=\"quick-card-icon\">🔗</div><div class=\"quick-card-label\">" + app.nombre + "</div>";
    card.onclick = () => abrirApp(app, null);
    cont.appendChild(card);
  });
  if (appsPlanas.length === 0) {
    cont.innerHTML = "<div class=\"empty-note\">Aún no hay aplicaciones activas</div>";
  }
}

function renderAnuncios(anuncios) {
  const cont = document.getElementById("anuncios");
  cont.innerHTML = "";
  anuncios.forEach(a => {
    const card = document.createElement("div");
    card.className = "anuncio-card";
    card.innerHTML =
      "<div class=\"anuncio-titulo\">" + a.titulo + "</div>" +
      "<div class=\"anuncio-texto\">" + (a.texto || "") + "</div>" +
      "<div class=\"anuncio-fecha\">" + (a.fecha || "") + "</div>";
    cont.appendChild(card);
  });
  if (anuncios.length === 0) {
    cont.innerHTML = "<div class=\"empty-note\">Sin anuncios por ahora</div>";
  }
}

function appVisibleParaUsuario(app) {
  if (!app.rolesPermitidos || app.rolesPermitidos.includes("*")) return true;
  return app.rolesPermitidos.includes(currentUserRole);
}

function ocultarTodasLasVistas() {
  document.getElementById("home").style.display = "none";
  document.getElementById("loading-overlay").style.display = "none";
  document.getElementById("construccion-view").style.display = "none";
  document.getElementById("app-frame").style.display = "none";
}

function marcarActivo(itemEl) {
  document.querySelectorAll(".app-item").forEach(el => el.classList.remove("active"));
  if (itemEl) itemEl.classList.add("active");
}

function abrirApp(app, itemEl) {
  marcarActivo(itemEl);
  document.getElementById("current-app-label").textContent = app.nombre;
  document.getElementById("reload-btn").style.display = "inline-block";

  const frame = document.getElementById("app-frame");
  const overlay = document.getElementById("loading-overlay");
  const label = document.getElementById("loading-label");

  ocultarTodasLasVistas();
  label.textContent = "Cargando " + app.nombre + "…";
  overlay.style.display = "flex";

  frame.onload = () => {
    overlay.style.display = "none";
    frame.style.display = "block";
  };
  frame.src = app.url;
}

function mostrarConstruccion(app, itemEl) {
  marcarActivo(itemEl);
  document.getElementById("current-app-label").textContent = app.nombre;
  document.getElementById("reload-btn").style.display = "none";
  ocultarTodasLasVistas();
  document.getElementById("construccion-app-name").textContent = app.nombre + " — esta sección está en construcción";
  document.getElementById("construccion-view").style.display = "flex";
}

function reloadFrame() {
  const frame = document.getElementById("app-frame");
  const overlay = document.getElementById("loading-overlay");
  const label = document.getElementById("loading-label");
  if (!frame.src) return;
  label.textContent = "Recargando…";
  frame.style.display = "none";
  overlay.style.display = "flex";
  frame.onload = () => {
    overlay.style.display = "none";
    frame.style.display = "block";
  };
  frame.src = frame.src.split("?")[0] + "?_=" + Date.now();
}

function toggleTheme() {
  const body = document.body;
  const isDark = body.getAttribute("data-theme") === "dark";
  body.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-toggle").textContent = isDark ? "🌙" : "☀️";
}

cargarApps();
</script>
</body>
</html>
