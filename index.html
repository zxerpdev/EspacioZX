<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espacio Zubex</title>
<style>
  :root{
    --zx-blue-dark:#0D18A8;
    --zx-blue:#227EF6;
    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#1c2233;
    --muted:#6b7385;
    --border:#e3e7f1;
    --rail-w:68px;
    --panel-w:290px;
  }
  [data-theme="dark"]{
    --bg:#0b0e17;
    --panel:#141a2b;
    --text:#eef1fa;
    --muted:#9aa3ba;
    --border:#232b42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins','Segoe UI', -apple-system, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:var(--rail-w);
    background:var(--panel);
    border-right:1px solid var(--border);
    box-shadow:6px 0 24px rgba(13,24,168,.06);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    z-index:10;
    flex-shrink:0;
    transition:width .32s cubic-bezier(.4,0,.2,1);
  }
  #sidebar.expanded{ width:var(--panel-w); }
  [data-theme="dark"] #sidebar{ box-shadow:6px 0 24px rgba(0,0,0,.35); }

  #sidebar-header{
    position:relative;
    padding:16px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    min-height:64px;
  }
  #logo-chip{ cursor:pointer; display:flex; align-items:center; gap:10px; overflow:hidden; }
  #logo-mark{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg, var(--zx-blue), var(--zx-blue-dark));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px; letter-spacing:.3px;
    box-shadow:0 0 14px rgba(34,126,246,.45);
  }
  #logo-text{
    display:flex; flex-direction:column; gap:2px;
    white-space:nowrap;
    opacity:0; width:0; overflow:hidden;
    transition:opacity .2s ease .05s;
  }
  #sidebar.expanded #logo-text{ opacity:1; width:auto; }
  #logo-wordmark{
    font-size:22px;
    font-weight:700;
    color:var(--zx-blue-dark);
    letter-spacing:-.5px;
    line-height:1;
    display:flex;
    align-items:flex-start;
    gap:2px;
  }
  #logo-wordmark sup{
    font-size:10px;
    font-weight:600;
    margin-top:2px;
  }
  #logo-tagline{
    font-size:10px;
    font-weight:600;
    letter-spacing:1.4px;
    color:var(--muted);
    text-transform:uppercase;
  }
  #theme-toggle{
    margin-left:auto;
    flex-shrink:0;
    background:rgba(13,24,168,.08);
    border:1px solid rgba(13,24,168,.15);
    color:var(--zx-blue-dark);
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  #sidebar.expanded #theme-toggle{ opacity:1; pointer-events:auto; }

  #pin-toggle{
    position:fixed;
    top:26px;
    left:calc(var(--rail-w) - 13px);
    width:26px; height:26px; border-radius:50%;
    background:linear-gradient(135deg, var(--zx-blue), var(--zx-blue-dark));
    border:2px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:11px; color:#fff;
    box-shadow:0 0 12px rgba(34,126,246,.5);
    z-index:20;
    transition:left .32s cubic-bezier(.4,0,.2,1);
  }
  #sidebar.expanded ~ #pin-toggle{ left:calc(var(--panel-w) - 13px); }
  #theme-toggle:hover{ background:rgba(13,24,168,.15); }

  /* ---------- AREAS / SUBAREAS (acordeón) ---------- */
  /* Cada área es una tarjeta separada, no una fila continua que se
     funde con las demás — separación por espacio + fondo propio. */
  #areas-container{ padding:12px 10px; display:flex; flex-direction:column; gap:8px; }
  #sidebar:not(.expanded) #areas-container{ display:none; }

  #rail-icons{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:14px 0;
  }
  #sidebar:not(.expanded) #rail-icons{ display:flex; }
  .rail-icon-btn{
    width:38px; height:38px;
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    color:var(--zx-blue-dark);
    background:rgba(34,126,246,.08);
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .rail-icon-btn:hover{ background:rgba(34,126,246,.16); border-color:rgba(34,126,246,.25); }
  .rail-icon-btn svg{ width:18px; height:18px; }
  .area-block{
    border:1px solid var(--border);
    border-radius:12px;
    background:rgba(34,126,246,.025);
    overflow:hidden;
    transition:border-color .18s ease, background .18s ease;
  }
  [data-theme="dark"] .area-block{ background:rgba(255,255,255,.02); }
  .area-block.expanded{
    border-color:rgba(34,126,246,.30);
    background:rgba(34,126,246,.05);
  }
  .area-header{
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .area-header:hover{ background:rgba(34,126,246,.08); }
  .area-header-left{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .area-icon{ width:15px; height:15px; display:inline-flex; color:var(--zx-blue-dark); }
  .area-icon svg{ width:100%; height:100%; }
  .area-title{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.7px;
  }
  .area-chevron{
    font-size:10px;
    color:var(--muted);
    transition:transform .18s ease;
  }
  .area-block.expanded > .area-header .area-chevron{ transform:rotate(90deg); }
  .area-block.expanded > .area-header .area-title{ color:var(--zx-blue-dark); }
  [data-theme="dark"] .area-block.expanded > .area-header .area-title{ color:var(--zx-blue); }
  .area-body{
    max-height:0;
    overflow:hidden;
    padding:0 8px;
    border-top:1px solid transparent;
    transition:max-height .22s ease, padding .22s ease;
  }
  .area-block.expanded > .area-body{
    max-height:2000px;
    padding:6px 8px 10px;
    border-top-color:var(--border);
  }

  .subarea-block{
    margin:6px 0;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
  }
  .subarea-block.expanded{ border-color:rgba(34,126,246,.25); }
  .subarea-header{
    padding:9px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
    border-radius:9px 9px 0 0;
  }
  .subarea-header:hover{ background:rgba(34,126,246,.07); }
  .subarea-header-left{ display:flex; align-items:center; gap:7px; }
  .subarea-icon{ width:13px; height:13px; display:inline-flex; color:var(--muted); }
  .subarea-icon svg{ width:100%; height:100%; }
  .subarea-title{
    font-size:11.5px;
    font-weight:600;
    color:var(--text);
  }
  .subarea-chevron{
    font-size:9px;
    color:var(--muted);
    transition:transform .18s ease;
  }
  .subarea-block.expanded > .subarea-header .subarea-chevron{ transform:rotate(90deg); }
  .subarea-body{
    max-height:0;
    overflow:hidden;
    padding:0 8px;
    transition:max-height .2s ease, padding .2s ease;
  }
  .subarea-block.expanded > .subarea-body{ max-height:1200px; padding:2px 8px 8px; }

  .app-item{
    --mx:50%;
    --my:50%;
    position:relative;
    margin:6px 2px;
    padding:2px;
    border-radius:12px;
    background:
      linear-gradient(var(--panel),var(--panel)) padding-box,
      radial-gradient(circle 170px at var(--mx) var(--my), var(--zx-blue) 0%, rgba(34,126,246,.35) 40%, transparent 72%) border-box;
    border:2px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .app-item:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(13,24,168,.10);
  }
  .app-item.active{
    background:
      linear-gradient(90deg, rgba(34,126,246,.16), rgba(34,126,246,.03)) padding-box,
      linear-gradient(var(--panel),var(--panel)) padding-box,
      radial-gradient(circle 170px at var(--mx) var(--my), var(--zx-blue) 0%, rgba(34,126,246,.35) 40%, transparent 72%) border-box;
    border:2px solid transparent;
  }
  .app-item.active::after{
    content:'';
    position:absolute;
    left:1px; top:9px; bottom:9px; width:3px;
    border-radius:3px;
    background:linear-gradient(180deg, var(--zx-blue), var(--zx-blue-dark));
    box-shadow:0 0 10px rgba(34,126,246,.7);
  }
  .app-item.active strong{ color:var(--zx-blue-dark); font-weight:700; }
  [data-theme="dark"] .app-item.active strong{ color:var(--zx-blue); }
  .app-item-inner{
    padding:9px 13px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border-radius:10px;
    pointer-events:none;
  }
  .app-item .app-desc{font-size:11px;color:var(--muted); font-weight:400;}
  .app-item strong{
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    letter-spacing:.1px;
  }
  .app-item.pendiente{ opacity:.75; }
  .badge-proximamente{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--zx-blue-dark);
    background:rgba(13,24,168,.10);
    border-radius:6px;
    padding:2px 6px;
    margin-left:6px;
  }
  .empty-note{
    font-size:11px;
    color:var(--muted);
    padding:6px 6px 10px;
    font-style:italic;
  }

  /* ---------- MAIN AREA ---------- */
  #main{flex:1;display:flex;flex-direction:column;}
  #topbar{
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #reload-btn, #home-btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-size:12px;
    margin-left:8px;
  }
  #topbar-actions{ display:flex; align-items:center; }

  @keyframes viewFadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  #home.visible, #loading-overlay.visible, #construccion-view.visible, #app-frame.visible{
    animation:viewFadeIn .22s ease;
  }

  iframe{flex:1;border:none;width:100%;background:#fff;}

  /* ---------- HOME / DASHBOARD ---------- */
  #home{
    flex:1;
    overflow-y:auto;
    padding:40px 24px 30px;
    background:
      radial-gradient(500px 300px at 15% -10%, rgba(34,126,246,.08), transparent 60%),
      radial-gradient(500px 300px at 90% 0%, rgba(13,24,168,.06), transparent 60%),
      var(--bg);
  }
  #home-inner{ max-width:760px; margin:0 auto; text-align:center; }
  #home h1{
    font-size:24px;
    font-weight:700;
    color:var(--zx-blue-dark);
    margin:0 0 26px;
    letter-spacing:.2px;
  }
  #home-orb{
    width:110px;
    height:110px;
    margin:0 auto 30px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--zx-blue-dark), var(--zx-blue));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-size:26px;
    letter-spacing:1px;
    box-shadow:0 10px 34px rgba(13,24,168,.28), 0 0 0 8px rgba(34,126,246,.08);
  }
  #home-tagline{
    font-size:14px;
    color:var(--muted);
    margin-bottom:24px;
  }
  #home-continue{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(120deg, var(--zx-blue-dark), var(--zx-blue));
    color:#fff;
    border:none;
    padding:11px 26px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:36px;
  }
  .home-section-title{
    text-align:left;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:var(--muted);
    margin:0 0 12px;
  }
  #quick-access{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
    gap:12px;
    margin-bottom:30px;
  }
  .quick-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .quick-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(13,24,168,.10); }
  .quick-card-icon{ width:26px; height:26px; margin:0 auto 8px; color:var(--zx-blue-dark); }
  .quick-card-icon svg{ width:100%; height:100%; }
  .quick-card-label{ font-size:12px; font-weight:600; color:var(--text); }

  #anuncios{ display:flex; flex-direction:column; gap:10px; text-align:left; }
  .anuncio-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
  }
  .anuncio-titulo{ font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:3px; }
  .anuncio-texto{ font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .anuncio-fecha{ font-size:11px; color:var(--muted); }

  /* ---------- LOADING / EN CONSTRUCCIÓN ---------- */
  #loading-overlay, #construccion-view{
    flex:1;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--bg);
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:20px;
  }
  .spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid var(--border);
    border-top-color:var(--zx-blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #construccion-view{ position:relative; }
  #construccion-view img{
    max-width:520px;
    width:88%;
  }
  #construccion-view .c-title{ font-size:15px; font-weight:700; color:var(--text); }
  #construccion-home-btn{
    background:rgba(13,24,168,.08);
    border:1px solid rgba(13,24,168,.15);
    color:var(--zx-blue-dark);
    border-radius:999px;
    padding:8px 18px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  #construccion-home-btn:hover{ background:rgba(13,24,168,.15); }
</style>
</head>

function iconFor(id) {
  return ICONS[id] || ICONS.generico;
}

async function cargarApps() {
  const contenedor = document.getElementById("areas-container");
  try {
    const res = await fetch("apps.json?_=" + Date.now());
    const data = await res.json();

    contenedor.innerHTML = "";
    appsPlanas = [];

    data.areas.forEach(area => {
      const tieneApps = area.apps && area.apps.length > 0;
      const tieneSubareas = area.subareas && area.subareas.length > 0;
      if (!tieneApps && !tieneSubareas) return;

      const bloque = document.createElement("div");
      bloque.className = "area-block";
      bloque.setAttribute("data-area-id", area.id);

      const header = document.createElement("div");
      header.className = "area-header";
      header.innerHTML =
        "<div class=\"area-header-left\">" +
          "<span class=\"area-icon\">" + iconFor(area.id) + "</span>" +
          "<span class=\"area-title\">" + area.nombre + "</span>" +
        "</div>" +
        "<span class=\"area-chevron\">▶</span>";
      header.onclick = () => bloque.classList.toggle("expanded");
      bloque.appendChild(header);

      const body = document.createElement("div");
      body.className = "area-body";

      if (tieneSubareas) {
        area.subareas.forEach(sub => {
          const subBloque = document.createElement("div");
          subBloque.className = "subarea-block";

          const subHeader = document.createElement("div");
          subHeader.className = "subarea-header";
          subHeader.innerHTML =
            "<div class=\"subarea-header-left\">" +
              "<span class=\"subarea-icon\">" + iconFor(sub.id) + "</span>" +
              "<span class=\"subarea-title\">" + sub.nombre + "</span>" +
            "</div>" +
            "<span class=\"subarea-chevron\">▶</span>";
          subHeader.onclick = (e) => { e.stopPropagation(); subBloque.classList.toggle("expanded"); };
          subBloque.appendChild(subHeader);

          const subBody = document.createElement("div");
          subBody.className = "subarea-body";
          if (sub.apps && sub.apps.length > 0) {
            sub.apps.filter(appVisibleParaUsuario).forEach(app => {
              subBody.appendChild(crearAppItem(app, sub.id));
            });
          } else {
            subBody.innerHTML = "<div class=\"empty-note\">Sin herramientas aún</div>";
          }
          subBloque.appendChild(subBody);
          body.appendChild(subBloque);
        });
      } else {
        area.apps.filter(appVisibleParaUsuario).forEach(app => {
          body.appendChild(crearAppItem(app, area.id));
        });
      }

      bloque.appendChild(body);
      contenedor.appendChild(bloque);
    });

    renderQuickAccess();
    renderAnuncios(data.anuncios || []);
    renderRailIcons(data.areas);
  } catch (err) {
    contenedor.innerHTML = "<div style=\"padding:16px;color:#c0392b;font-size:13px\">No se pudo cargar apps.json (" + err.message + ")</div>";
  }
}

function crearAppItem(app, areaId) {
  const disponible = app.estado !== "en_desarrollo" && !!app.url;
  if (disponible) appsPlanas.push({ ...app, _areaId: areaId });

  const item = document.createElement("div");
  item.className = "app-item" + (disponible ? "" : " pendiente");
  const badge = disponible ? "" : "<span class=\"badge-proximamente\">Próximamente</span>";
  item.innerHTML = "<div class=\"app-item-inner\"><strong>" + app.nombre + badge + "</strong><span class=\"app-desc\">" + (app.descripcion || "") + "</span></div>";
  item.addEventListener("mousemove", (e) => {
    const rect = item.getBoundingClientRect();
    item.style.setProperty("--mx", (e.clientX - rect.left) + "px");
    item.style.setProperty("--my", (e.clientY - rect.top) + "px");
  });
  item.onclick = (e) => {
    e.stopPropagation();
    if (disponible) {
      abrirApp(app, item);
    } else {
      mostrarConstruccion(app, item);
    }
  };
  return item;
}

function renderQuickAccess() {
  const cont = document.getElementById("quick-access");
  cont.innerHTML = "";
  appsPlanas.slice(0, 6).forEach(app => {
    const card = document.createElement("div");
    card.className = "quick-card";
    card.innerHTML = "<div class=\"quick-card-icon\">" + iconFor(app._areaId) + "</div><div class=\"quick-card-label\">" + app.nombre + "</div>";
    card.onclick = () => abrirApp(app, null);
    cont.appendChild(card);
  });
  if (appsPlanas.length === 0) {
    cont.innerHTML = "<div class=\"empty-note\">Aún no hay aplicaciones activas</div>";
  }
}

function renderAnuncios(anuncios) {
  const cont = document.getElementById("anuncios");
  cont.innerHTML = "";
  anuncios.forEach(a => {
    const card = document.createElement("div");
    card.className = "anuncio-card";
    card.innerHTML =
      "<div class=\"anuncio-titulo\">" + a.titulo + "</div>" +
      "<div class=\"anuncio-texto\">" + (a.texto || "") + "</div>" +
      "<div class=\"anuncio-fecha\">" + (a.fecha || "") + "</div>";
    cont.appendChild(card);
  });
  if (anuncios.length === 0) {
    cont.innerHTML = "<div class=\"empty-note\">Sin anuncios por ahora</div>";
  }
}

function appVisibleParaUsuario(app) {
  if (!app.rolesPermitidos || app.rolesPermitidos.includes("*")) return true;
  return app.rolesPermitidos.includes(currentUserRole);
}

function ocultarTodasLasVistas() {
  ["home", "loading-overlay", "construccion-view", "app-frame"].forEach(id => {
    const el = document.getElementById(id);
    el.style.display = "none";
    el.classList.remove("visible");
  });
}

function mostrarVista(id, display) {
  const el = document.getElementById(id);
  el.style.display = display;
  // reiniciar la animación aunque se repita la misma vista
  el.classList.remove("visible");
  void el.offsetWidth;
  el.classList.add("visible");
}

function marcarActivo(itemEl) {
  document.querySelectorAll(".app-item").forEach(el => el.classList.remove("active"));
  if (itemEl) itemEl.classList.add("active");
}

function goHome() {
  marcarActivo(null);
  document.getElementById("current-app-label").textContent = "Inicio";
  document.getElementById("reload-btn").style.display = "none";
  document.getElementById("home-btn").style.display = "none";
  ocultarTodasLasVistas();
  mostrarVista("home", "block");
}

function abrirApp(app, itemEl) {
  marcarActivo(itemEl);
  document.getElementById("current-app-label").textContent = app.nombre;
  document.getElementById("reload-btn").style.display = "inline-block";
  document.getElementById("home-btn").style.display = "inline-block";

  const frame = document.getElementById("app-frame");
  const overlay = document.getElementById("loading-overlay");
  const label = document.getElementById("loading-label");

  ocultarTodasLasVistas();
  label.textContent = "Cargando " + app.nombre + "…";
  mostrarVista("loading-overlay", "flex");

  frame.onload = () => {
    overlay.style.display = "none";
    overlay.classList.remove("visible");
    mostrarVista("app-frame", "block");
  };
  frame.src = app.url;
}

function mostrarConstruccion(app, itemEl) {
  marcarActivo(itemEl);
  document.getElementById("current-app-label").textContent = app.nombre;
  document.getElementById("reload-btn").style.display = "none";
  document.getElementById("home-btn").style.display = "inline-block";
  ocultarTodasLasVistas();
  document.getElementById("construccion-app-name").textContent = app.nombre + " — esta sección está en construcción";
  mostrarVista("construccion-view", "flex");
}

function reloadFrame() {
  const frame = document.getElementById("app-frame");
  const overlay = document.getElementById("loading-overlay");
  const label = document.getElementById("loading-label");
  if (!frame.src) return;
  label.textContent = "Recargando…";
  frame.style.display = "none";
  mostrarVista("loading-overlay", "flex");
  frame.onload = () => {
    overlay.style.display = "none";
    overlay.classList.remove("visible");
    mostrarVista("app-frame", "block");
  };
  frame.src = frame.src.split("?")[0] + "?_=" + Date.now();
}

function toggleTheme() {
  const body = document.body;
  const isDark = body.getAttribute("data-theme") === "dark";
  body.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-toggle").textContent = isDark ? "🌙" : "☀️";
}

// ---------------------------------------------------------------
// Rail auto-hide: el sidebar vive colapsado (solo iconos) y se
// expande al pasar el mouse, o se puede fijar con el botón "pin".
// ---------------------------------------------------------------
const sidebarEl = document.getElementById("sidebar");
let pinned = false;
let collapseTimer = null;

function expandSidebar() {
  clearTimeout(collapseTimer);
  sidebarEl.classList.add("expanded");
}
function scheduleCollapse() {
  if (pinned) return;
  collapseTimer = setTimeout(() => sidebarEl.classList.remove("expanded"), 450);
}
sidebarEl.addEventListener("mouseenter", expandSidebar);
sidebarEl.addEventListener("mouseleave", scheduleCollapse);

function togglePin(e) {
  e.stopPropagation();
  pinned = !pinned;
  document.getElementById("pin-toggle").textContent = pinned ? "‹" : "›";
  if (pinned) expandSidebar(); else scheduleCollapse();
}

function renderRailIcons(areas) {
  const cont = document.getElementById("rail-icons");
  cont.innerHTML = "";
  areas.forEach(area => {
    const tieneApps = area.apps && area.apps.length > 0;
    const tieneSubareas = area.subareas && area.subareas.length > 0;
    if (!tieneApps && !tieneSubareas) return;
    const btn = document.createElement("div");
    btn.className = "rail-icon-btn";
    btn.title = area.nombre;
    btn.innerHTML = iconFor(area.id);
    btn.onclick = () => {
      expandSidebar();
      const bloque = document.querySelector('.area-block[data-area-id="' + area.id + '"]');
      if (bloque) {
        bloque.classList.add("expanded");
        bloque.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    };
    cont.appendChild(btn);
  });
}

cargarApps();
</script>
<script>
// ---------------------------------------------------------------
// Splash Cursor (adaptado de react-bits, sin React) — estela de
// "tinta" líquida en WebGL que sigue el cursor. Se activa una sola
// vez al cargar la página; usa los colores de marca por defecto.
// ---------------------------------------------------------------
function initSplashCursor(userConfig) {
  userConfig = userConfig || {};

  // crear el canvas de pantalla completa, sin interceptar clics
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.top = '0';
  wrapper.style.left = '0';
  wrapper.style.zIndex = '5'; // debajo del sidebar/topbar (que llevan su propio z-index natural por orden de pintado)
  wrapper.style.pointerEvents = 'none';
  wrapper.style.width = '100%';
  wrapper.style.height = '100%';

  const canvas = document.createElement('canvas');
  canvas.id = 'fluid';
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  canvas.style.display = 'block';
  wrapper.appendChild(canvas);
  document.body.appendChild(wrapper);

  function pointerPrototype() {
    this.id = -1;
    this.texcoordX = 0;
    this.texcoordY = 0;
    this.prevTexcoordX = 0;
    this.prevTexcoordY = 0;
    this.deltaX = 0;
    this.deltaY = 0;
    this.down = false;
    this.moved = false;
    this.color = [0, 0, 0];
  }

  let config = {
    SIM_RESOLUTION: 128,
    DYE_RESOLUTION: 1440,
    CAPTURE_RESOLUTION: 512,
    DENSITY_DISSIPATION: 3.5,
    VELOCITY_DISSIPATION: 2,
    PRESSURE: 0.1,
    PRESSURE_ITERATIONS: 20,
    CURL: 3,
    SPLAT_RADIUS: 0.2,
    SPLAT_FORCE: 6000,
    SHADING: true,
    COLOR_UPDATE_SPEED: 10,
    PAUSED: false,
    BACK_COLOR: { r: 0.5, g: 0, b: 0 },
    TRANSPARENT: true,
    RAINBOW_MODE: false,
    COLOR: '#227EF6',
    ...userConfig
  };

  let pointers = [new pointerPrototype()];

  const { gl, ext } = getWebGLContext(canvas);
  if (!gl) return null; // navegador sin soporte WebGL: no hacer nada

  if (!ext.supportLinearFiltering) {
    config.DYE_RESOLUTION = 256;
    config.SHADING = false;
  }

  function getWebGLContext(canvas) {
    const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
    let gl = canvas.getContext('webgl2', params);
    const isWebGL2 = !!gl;
    if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
    if (!gl) return { gl: null, ext: {} };

    let halfFloat;
    let supportLinearFiltering;
    if (isWebGL2) {
      gl.getExtension('EXT_color_buffer_float');
      supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
    } else {
      halfFloat = gl.getExtension('OES_texture_half_float');
      supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
    }
    gl.clearColor(0.0, 0.0, 0.0, 1.0);

    const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat && halfFloat.HALF_FLOAT_OES;
    let formatRGBA, formatRG, formatR;

    if (isWebGL2) {
      formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
      formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
      formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
    } else {
      formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatRG = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
    }

    return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
  }

  function getSupportedFormat(gl, internalFormat, format, type) {
    if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
      switch (internalFormat) {
        case gl.R16F: return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
        case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
        default: return null;
      }
    }
    return { internalFormat, format };
  }

  function supportRenderTextureFormat(gl, internalFormat, format, type) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  }

  class Material {
    constructor(vertexShader, fragmentShaderSource) {
      this.vertexShader = vertexShader;
      this.fragmentShaderSource = fragmentShaderSource;
      this.programs = [];
      this.activeProgram = null;
      this.uniforms = [];
    }
    setKeywords(keywords) {
      let hash = 0;
      for (let i = 0; i < keywords.length; i++) hash += hashCode(keywords[i]);
      let program = this.programs[hash];
      if (program == null) {
        let fragmentShader = compileShader(gl.FRAGMENT_SHADER, this.fragmentShaderSource, keywords);
        program = createProgram(this.vertexShader, fragmentShader);
        this.programs[hash] = program;
      }
      if (program === this.activeProgram) return;
      this.uniforms = getUniforms(program);
      this.activeProgram = program;
    }
    bind() { gl.useProgram(this.activeProgram); }
  }

  class Program {
    constructor(vertexShader, fragmentShader) {
      this.uniforms = {};
      this.program = createProgram(vertexShader, fragmentShader);
      this.uniforms = getUniforms(this.program);
    }
    bind() { gl.useProgram(this.program); }
  }

  function createProgram(vertexShader, fragmentShader) {
    let program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.trace(gl.getProgramInfoLog(program));
    return program;
  }

  function getUniforms(program) {
    let uniforms = [];
    let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < uniformCount; i++) {
      let uniformName = gl.getActiveUniform(program, i).name;
      uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
    }
    return uniforms;
  }

  function compileShader(type, source, keywords) {
    source = addKeywords(source, keywords);
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.trace(gl.getShaderInfoLog(shader));
    return shader;
  }

  function addKeywords(source, keywords) {
    if (!keywords) return source;
    let keywordsString = '';
    keywords.forEach(keyword => { keywordsString += '#define ' + keyword + '\n'; });
    return keywordsString + source;
  }

  const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
    precision highp float;
    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform vec2 texelSize;
    void main () {
        vUv = aPosition * 0.5 + 0.5;
        vL = vUv - vec2(texelSize.x, 0.0);
        vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y);
        vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `);

  const copyShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    void main () { gl_FragColor = texture2D(uTexture, vUv); }
  `);

  const clearShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    uniform float value;
    void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
  `);

  const displayShaderSource = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uTexture;
    uniform sampler2D uDithering;
    uniform vec2 ditherScale;
    uniform vec2 texelSize;
    vec3 linearToGamma (vec3 color) {
        color = max(color, vec3(0));
        return max(1.055 * pow(color, vec3(0.416666667)) - 0.055, vec3(0));
    }
    void main () {
        vec3 c = texture2D(uTexture, vUv).rgb;
        #ifdef SHADING
            vec3 lc = texture2D(uTexture, vL).rgb;
            vec3 rc = texture2D(uTexture, vR).rgb;
            vec3 tc = texture2D(uTexture, vT).rgb;
            vec3 bc = texture2D(uTexture, vB).rgb;
            float dx = length(rc) - length(lc);
            float dy = length(tc) - length(bc);
            vec3 n = normalize(vec3(dx, dy, length(texelSize)));
            vec3 l = vec3(0.0, 0.0, 1.0);
            float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
            c *= diffuse;
        #endif
        float a = max(c.r, max(c.g, c.b));
        gl_FragColor = vec4(c, a);
    }
  `;

  const splatShader = compileShader(gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;
    void main () {
        vec2 p = vUv - point.xy;
        p.x *= aspectRatio;
        vec3 splat = exp(-dot(p, p) / radius) * color;
        vec3 base = texture2D(uTarget, vUv).xyz;
        gl_FragColor = vec4(base + splat, 1.0);
    }
  `);

  const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 dyeTexelSize;
    uniform float dt;
    uniform float dissipation;
    vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
        vec2 st = uv / tsize - 0.5;
        vec2 iuv = floor(st);
        vec2 fuv = fract(st);
        vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
        vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
        vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
        vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
        return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
    }
    void main () {
        #ifdef MANUAL_FILTERING
            vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
            vec4 result = bilerp(uSource, coord, dyeTexelSize);
        #else
            vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
            vec4 result = texture2D(uSource, coord);
        #endif
        float decay = 1.0 + dissipation * dt;
        gl_FragColor = result / decay;
    }
  `, ext.supportLinearFiltering ? null : ['MANUAL_FILTERING']);

  const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uVelocity, vL).x;
        float R = texture2D(uVelocity, vR).x;
        float T = texture2D(uVelocity, vT).y;
        float B = texture2D(uVelocity, vB).y;
        vec2 C = texture2D(uVelocity, vUv).xy;
        if (vL.x < 0.0) { L = -C.x; }
        if (vR.x > 1.0) { R = -C.x; }
        if (vT.y > 1.0) { T = -C.y; }
        if (vB.y < 0.0) { B = -C.y; }
        float div = 0.5 * (R - L + T - B);
        gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }
  `);

  const curlShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uVelocity, vL).y;
        float R = texture2D(uVelocity, vR).y;
        float T = texture2D(uVelocity, vT).x;
        float B = texture2D(uVelocity, vB).x;
        float vorticity = R - L - T + B;
        gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }
  `);

  const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;
    void main () {
        float L = texture2D(uCurl, vL).x;
        float R = texture2D(uCurl, vR).x;
        float T = texture2D(uCurl, vT).x;
        float B = texture2D(uCurl, vB).x;
        float C = texture2D(uCurl, vUv).x;
        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 0.0001;
        force *= curl * C;
        force.y *= -1.0;
        vec2 velocity = texture2D(uVelocity, vUv).xy;
        velocity += force * dt;
        velocity = min(max(velocity, -1000.0), 1000.0);
        gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
  `);

  const pressureShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uDivergence;
    void main () {
        float L = texture2D(uPressure, vL).x;
        float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x;
        float B = texture2D(uPressure, vB).x;
        float C = texture2D(uPressure, vUv).x;
        float divergence = texture2D(uDivergence, vUv).x;
        float pressure = (L + R + B + T - divergence) * 0.25;
        gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }
  `);

  const gradientSubtractShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uPressure, vL).x;
        float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x;
        float B = texture2D(uPressure, vB).x;
        vec2 velocity = texture2D(uVelocity, vUv).xy;
        velocity.xy -= vec2(R - L, T - B);
        gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
  `);

  const blit = (() => {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);
    return (target, clear = false) => {
      if (target == null) {
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      } else {
        gl.viewport(0, 0, target.width, target.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
      }
      if (clear) {
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    };
  })();

  let dye, velocity, divergence, curl, pressure;

  const copyProgram = new Program(baseVertexShader, copyShader);
  const clearProgram = new Program(baseVertexShader, clearShader);
  const splatProgram = new Program(baseVertexShader, splatShader);
  const advectionProgram = new Program(baseVertexShader, advectionShader);
  const divergenceProgram = new Program(baseVertexShader, divergenceShader);
  const curlProgram = new Program(baseVertexShader, curlShader);
  const vorticityProgram = new Program(baseVertexShader, vorticityShader);
  const pressureProgram = new Program(baseVertexShader, pressureShader);
  const gradienSubtractProgram = new Program(baseVertexShader, gradientSubtractShader);
  const displayMaterial = new Material(baseVertexShader, displayShaderSource);

  function initFramebuffers() {
    let simRes = getResolution(config.SIM_RESOLUTION);
    let dyeRes = getResolution(config.DYE_RESOLUTION);
    const texType = ext.halfFloatTexType;
    const rgba = ext.formatRGBA;
    const rg = ext.formatRG;
    const r = ext.formatR;
    const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    gl.disable(gl.BLEND);

    if (!dye) dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
    else dye = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);

    if (!velocity) velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
    else velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);

    divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  }

  function createFBO(w, h, internalFormat, format, type, param) {
    gl.activeTexture(gl.TEXTURE0);
    let texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
    let fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);
    let texelSizeX = 1.0 / w;
    let texelSizeY = 1.0 / h;
    return {
      texture, fbo, width: w, height: h, texelSizeX, texelSizeY,
      attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; }
    };
  }

  function createDoubleFBO(w, h, internalFormat, format, type, param) {
    let fbo1 = createFBO(w, h, internalFormat, format, type, param);
    let fbo2 = createFBO(w, h, internalFormat, format, type, param);
    return {
      width: w, height: h, texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
      get read() { return fbo1; }, set read(value) { fbo1 = value; },
      get write() { return fbo2; }, set write(value) { fbo2 = value; },
      swap() { let temp = fbo1; fbo1 = fbo2; fbo2 = temp; }
    };
  }

  function resizeFBO(target, w, h, internalFormat, format, type, param) {
    let newFBO = createFBO(w, h, internalFormat, format, type, param);
    copyProgram.bind();
    gl.uniform1i(copyProgram.uniforms.uTexture, target.attach(0));
    blit(newFBO);
    return newFBO;
  }

  function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
    if (target.width === w && target.height === h) return target;
    target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
    target.write = createFBO(w, h, internalFormat, format, type, param);
    target.width = w; target.height = h;
    target.texelSizeX = 1.0 / w; target.texelSizeY = 1.0 / h;
    return target;
  }

  function updateKeywords() {
    let displayKeywords = [];
    if (config.SHADING) displayKeywords.push('SHADING');
    displayMaterial.setKeywords(displayKeywords);
  }

  updateKeywords();
  initFramebuffers();
  let lastUpdateTime = Date.now();
  let colorUpdateTimer = 0.0;
  let rafId = null;
  let active = true;

  function updateFrame() {
    if (!active) return;
    const dt = calcDeltaTime();
    if (resizeCanvas()) initFramebuffers();
    updateColors(dt);
    applyInputs();
    step(dt);
    render(null);
    rafId = requestAnimationFrame(updateFrame);
  }

  function calcDeltaTime() {
    let now = Date.now();
    let dt = (now - lastUpdateTime) / 1000;
    dt = Math.min(dt, 0.016666);
    lastUpdateTime = now;
    return dt;
  }

  function resizeCanvas() {
    let width = scaleByPixelRatio(canvas.clientWidth);
    let height = scaleByPixelRatio(canvas.clientHeight);
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width; canvas.height = height;
      return true;
    }
    return false;
  }

  function updateColors(dt) {
    colorUpdateTimer += dt * config.COLOR_UPDATE_SPEED;
    if (colorUpdateTimer >= 1) {
      colorUpdateTimer = wrap(colorUpdateTimer, 0, 1);
      pointers.forEach(p => { p.color = generateColor(); });
    }
  }

  function applyInputs() {
    pointers.forEach(p => { if (p.moved) { p.moved = false; splatPointer(p); } });
  }

  function step(dt) {
    gl.disable(gl.BLEND);
    curlProgram.bind();
    gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl);

    vorticityProgram.bind();
    gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
    gl.uniform1f(vorticityProgram.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    divergenceProgram.bind();
    gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    clearProgram.bind();
    gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
    blit(pressure.write);
    pressure.swap();

    pressureProgram.bind();
    gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
      gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write);
      pressure.swap();
    }

    gradienSubtractProgram.bind();
    gl.uniform2f(gradienSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(gradienSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradienSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write);
    velocity.swap();

    advectionProgram.bind();
    gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    if (!ext.supportLinearFiltering) gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
    let velocityId = velocity.read.attach(0);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
    gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
    gl.uniform1f(advectionProgram.uniforms.dt, dt);
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
    blit(velocity.write);
    velocity.swap();

    if (!ext.supportLinearFiltering) gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
    blit(dye.write);
    dye.swap();
  }

  function render(target) {
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.BLEND);
    drawDisplay(target);
  }

  function drawDisplay(target) {
    let width = target == null ? gl.drawingBufferWidth : target.width;
    let height = target == null ? gl.drawingBufferHeight : target.height;
    displayMaterial.bind();
    if (config.SHADING) gl.uniform2f(displayMaterial.uniforms.texelSize, 1.0 / width, 1.0 / height);
    gl.uniform1i(displayMaterial.uniforms.uTexture, dye.read.attach(0));
    blit(target);
  }

  function splatPointer(pointer) {
    let dx = pointer.deltaX * config.SPLAT_FORCE;
    let dy = pointer.deltaY * config.SPLAT_FORCE;
    splat(pointer.texcoordX, pointer.texcoordY, dx, dy, pointer.color);
  }

  function clickSplat(pointer) {
    const color = generateColor();
    color.r *= 10.0; color.g *= 10.0; color.b *= 10.0;
    let dx = 10 * (Math.random() - 0.5);
    let dy = 30 * (Math.random() - 0.5);
    splat(pointer.texcoordX, pointer.texcoordY, dx, dy, color);
  }

  function splat(x, y, dx, dy, color) {
    splatProgram.bind();
    gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(splatProgram.uniforms.point, x, y);
    gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
    gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
    blit(dye.write);
    dye.swap();
  }

  function correctRadius(radius) {
    let aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) radius *= aspectRatio;
    return radius;
  }

  function updatePointerDownData(pointer, id, posX, posY) {
    pointer.id = id; pointer.down = true; pointer.moved = false;
    pointer.texcoordX = posX / canvas.width;
    pointer.texcoordY = 1.0 - posY / canvas.height;
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.deltaX = 0; pointer.deltaY = 0;
    pointer.color = generateColor();
  }

  function updatePointerMoveData(pointer, posX, posY, color) {
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.texcoordX = posX / canvas.width;
    pointer.texcoordY = 1.0 - posY / canvas.height;
    pointer.deltaX = correctDeltaX(pointer.texcoordX - pointer.prevTexcoordX);
    pointer.deltaY = correctDeltaY(pointer.texcoordY - pointer.prevTexcoordY);
    pointer.moved = Math.abs(pointer.deltaX) > 0 || Math.abs(pointer.deltaY) > 0;
    pointer.color = color;
  }

  function updatePointerUpData(pointer) { pointer.down = false; }

  function correctDeltaX(delta) {
    let aspectRatio = canvas.width / canvas.height;
    if (aspectRatio < 1) delta *= aspectRatio;
    return delta;
  }

  function correctDeltaY(delta) {
    let aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) delta /= aspectRatio;
    return delta;
  }

  function hexToRGB(hex) {
    let val = hex.replace('#', '');
    if (val.length === 3) val = val[0] + val[0] + val[1] + val[1] + val[2] + val[2];
    const r = parseInt(val.slice(0, 2), 16) / 255;
    const g = parseInt(val.slice(2, 4), 16) / 255;
    const b = parseInt(val.slice(4, 6), 16) / 255;
    return { r: r * 0.15, g: g * 0.15, b: b * 0.15 };
  }

  function generateColor() {
    if (!config.RAINBOW_MODE) return hexToRGB(config.COLOR);
    let c = HSVtoRGB(Math.random(), 1.0, 1.0);
    c.r *= 0.15; c.g *= 0.15; c.b *= 0.15;
    return c;
  }

  function HSVtoRGB(h, s, v) {
    let r, g, b, i, f, p, q, t;
    i = Math.floor(h * 6); f = h * 6 - i;
    p = v * (1 - s); q = v * (1 - f * s); t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: r = v; g = t; b = p; break;
      case 1: r = q; g = v; b = p; break;
      case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break;
      case 4: r = t; g = p; b = v; break;
      case 5: r = v; g = p; b = q; break;
      default: break;
    }
    return { r, g, b };
  }

  function wrap(value, min, max) {
    const range = max - min;
    if (range === 0) return min;
    return ((value - min) % range) + min;
  }

  function getResolution(resolution) {
    let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
    const min = Math.round(resolution);
    const max = Math.round(resolution * aspectRatio);
    if (gl.drawingBufferWidth > gl.drawingBufferHeight) return { width: max, height: min };
    else return { width: min, height: max };
  }

  function scaleByPixelRatio(input) {
    const pixelRatio = window.devicePixelRatio || 1;
    return Math.floor(input * pixelRatio);
  }

  function hashCode(s) {
    if (s.length === 0) return 0;
    let hash = 0;
    for (let i = 0; i < s.length; i++) { hash = (hash << 5) - hash + s.charCodeAt(i); hash |= 0; }
    return hash;
  }

  function handleMouseDown(e) {
    let pointer = pointers[0];
    let posX = scaleByPixelRatio(e.clientX);
    let posY = scaleByPixelRatio(e.clientY);
    updatePointerDownData(pointer, -1, posX, posY);
    clickSplat(pointer);
  }

  let firstMouseMoveHandled = false;
  function handleMouseMove(e) {
    let pointer = pointers[0];
    let posX = scaleByPixelRatio(e.clientX);
    let posY = scaleByPixelRatio(e.clientY);
    if (!firstMouseMoveHandled) {
      let color = generateColor();
      updatePointerMoveData(pointer, posX, posY, color);
      firstMouseMoveHandled = true;
    } else {
      updatePointerMoveData(pointer, posX, posY, pointer.color);
    }
  }

  function handleTouchStart(e) {
    const touches = e.targetTouches;
    let pointer = pointers[0];
    for (let i = 0; i < touches.length; i++) {
      let posX = scaleByPixelRatio(touches[i].clientX);
      let posY = scaleByPixelRatio(touches[i].clientY);
      updatePointerDownData(pointer, touches[i].identifier, posX, posY);
    }
  }

  function handleTouchMove(e) {
    const touches = e.targetTouches;
    let pointer = pointers[0];
    for (let i = 0; i < touches.length; i++) {
      let posX = scaleByPixelRatio(touches[i].clientX);
      let posY = scaleByPixelRatio(touches[i].clientY);
      updatePointerMoveData(pointer, posX, posY, pointer.color);
    }
  }

  function handleTouchEnd(e) {
    const touches = e.changedTouches;
    for (let i = 0; i < touches.length; i++) updatePointerUpData(pointers[0]);
  }

  window.addEventListener('mousedown', handleMouseDown);
  window.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('touchstart', handleTouchStart);
  window.addEventListener('touchmove', handleTouchMove, false);
  window.addEventListener('touchend', handleTouchEnd);

  updateFrame();

  // permite apagar el efecto en caliente desde la consola si hiciera falta:
  // window.disableSplashCursor()
  return function disable() {
    active = false;
    if (rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('mousedown', handleMouseDown);
    window.removeEventListener('mousemove', handleMouseMove);
    window.removeEventListener('touchstart', handleTouchStart);
    window.removeEventListener('touchmove', handleTouchMove);
    window.removeEventListener('touchend', handleTouchEnd);
    wrapper.remove();
  };
}

window.disableSplashCursor = initSplashCursor({
  RAINBOW_MODE: false,
  COLOR: '#227EF6',
  DENSITY_DISSIPATION: 3.5,
  VELOCITY_DISSIPATION: 2,
